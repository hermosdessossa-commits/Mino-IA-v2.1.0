[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mino-ia"
version = "2.1.0"
description = "Moteur mendélien déterministe et API de conseil génétique, avec rédaction optionnelle par LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Propriétaire — voir LICENSE" }
authors = [{ name = "Mino-IA" }]
keywords = ["génétique", "conseil génétique", "mendel", "api", "santé"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Flask",
  "Intended Audience :: Healthcare Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "flask>=3.1,<4",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
api = ["gunicorn>=22,<24"]
ml = [
  "torch>=2.1,<3",
  "transformers>=4.40,<6",
  "peft>=0.10,<1",
  "bitsandbytes>=0.43,<1",
  "accelerate>=0.29,<2",
  "datasets>=2.18,<6",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
mino-api = "api.app:main"
mino-dataset = "scripts.generation_dataset:main"
mino-validate = "scripts.validate_dataset:main"

[tool.setuptools]
packages = ["api", "core", "scripts"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:core.*",
  "error::DeprecationWarning:api.*",
]

[tool.coverage.run]
source = ["api", "core"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "venv", "model", "data/backups", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]
"training/*" = ["E402"]
"api/app.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]
