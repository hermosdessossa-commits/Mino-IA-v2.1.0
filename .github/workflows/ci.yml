name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Vérifier le formatage
        run: ruff format --check .

      - name: Vérifier le lint
        run: ruff check .

      - name: Compiler les modules
        run: python -m compileall -q core api scripts training tests wsgi.py

      - name: Lancer les tests
        run: python -m pytest -q

  dataset:
    name: Validation du dataset
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Générer un jeu de démonstration
        run: |
          python scripts/generation_dataset.py \
            --samples 120 \
            --seed 42 \
            --output-dir /tmp/mino-data \
            --no-backup

      - name: Valider le jeu généré
        run: |
          python scripts/validate_dataset.py \
            /tmp/mino-data/dataset_synthetique.csv \
            /tmp/mino-data/dataset_test.csv

      - name: Vérifier le dataset versionné
        run: |
          python scripts/validate_dataset.py \
            data/dataset_synthetique.csv \
            data/dataset_test.csv

      - name: Vérifier la compatibilité entraînement
        run: |
          python training/finetuning_lora.py --check-dataset \
            --train-csv /tmp/mino-data/dataset_synthetique.csv \
            --test-csv /tmp/mino-data/dataset_test.csv
